{% load static %}
<link rel="stylesheet" href="{% static 'blog/style.css' %}">

<div class="container">

<h1>{{ post.title }}</h1>
<p>{{ post.text }}</p>

<hr>

<h2>Comments</h2>

{% for comment in post.comments.all %}
    <div class="comment">
        {{ comment.text }}
    </div>
{% empty %}
    <p>No comments yet.</p>
{% endfor %}

<br>
<a href="{% url 'blog:index' %}">← Back to posts</a>

</div>
