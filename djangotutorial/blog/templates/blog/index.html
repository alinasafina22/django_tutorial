{% load static %}
<link rel="stylesheet" href="{% static 'blog/style.css' %}">


<div class="container">
    {% if latest_post_list %}
    <ul>
        {% for post in latest_post_list %}
        <li class="post">
            <a href="{% url 'blog:detail' post.id %}">
                {{ post.title }}
            </a>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No posts yet.</p>
    {% endif %}
</div>
